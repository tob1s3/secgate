# Политика гейта для самого secgate. Скопируйте и подстройте под свой проект.
[policy]
# Сборка падает при новой находке этого уровня или выше: LOW | MEDIUM | HIGH | CRITICAL.
fail_on = "HIGH"
# pip-audit не сообщает критичность — считаем такие находки средними.
unknown_as = "MEDIUM"
# Секрет в репозитории блокирует сборку всегда, и в baseline его принять нельзя.
block_secrets = true

# Необязательные лимиты по количеству: не больше N новых находок данного уровня.
[policy.max_count]
MEDIUM = 10
